name: data-pipeline

on:
  schedule:
    # All times UTC. GitHub cron can run several minutes late.
    - cron: "0 12 * * 2"        # Tue: weekly rebuild after Monday night
    - cron: "30 22 * * 3,4,5"   # Wed-Fri: after practice reports post
    - cron: "0 14 * * 6,0"      # Sat/Sun: final game statuses
  workflow_dispatch:
    inputs:
      season:
        description: "Season override (blank = current)"
        required: false
        default: ""
      week:
        description: "Week override (blank = next unplayed week)"
        required: false
        default: ""
      dry_run:
        description: "Build only, skip Cloudflare upload"
        type: boolean
        default: false

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEASON: ${{ inputs.season }}
      WEEK: ${{ inputs.week }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt

      - name: Build data
        run: python pipeline/build_data.py --out build/data

      - name: Upload build artifact (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: sim-simma-data
          path: build/data
          retention-days: 7

      - name: Set up Node
        if: ${{ !inputs.dry_run }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        if: ${{ !inputs.dry_run }}
        run: npm install -g wrangler@4

      - name: Apply D1 migrations
        if: ${{ !inputs.dry_run }}
        run: wrangler d1 migrations apply sim-simma-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish to KV and D1
        if: ${{ !inputs.dry_run }}
        run: python pipeline/publish.py --data build/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
